name: CuMetal CUDA

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: read

concurrency:
  group: cumetal-cuda-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  cuda-tests:
    name: CUDA runtime tests (CuMetal / Apple GPU)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CUMETAL_COMMIT: 041890f6f6f6e70b2f2ac1330987dd56a4f94b3c
      CUMETAL_SOURCE: /tmp/cuda-metal
      CUMETAL_PREFIX: /tmp/cumetal-install
      VIBEQC_BUILD: ${{ github.workspace }}/build-cumetal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -m)" = arm64
          xcrun --find metal

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          python-version: "3.11"
          enable-cache: true

      - name: Prepare Python codegen environment
        run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python numpy

      - name: Install CuMetal build prerequisites
        run: brew install llvm z3 ninja

      - name: Cache patched CuMetal toolchain
        id: cache-cumetal
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            /tmp/cuda-metal
            /tmp/cumetal-install
          key: cumetal-${{ runner.os }}-${{ runner.arch }}-${{ env.CUMETAL_COMMIT }}-${{ hashFiles('.github/scripts/patch_cumetal_*.py') }}

      - name: Build pinned CuMetal
        if: steps.cache-cumetal.outputs.cache-hit != 'true'
        run: |
          git clone --recurse-submodules https://github.com/Lulzx/cuda-metal.git "$CUMETAL_SOURCE"
          git -C "$CUMETAL_SOURCE" checkout "$CUMETAL_COMMIT"
          git -C "$CUMETAL_SOURCE" submodule update --init --recursive
          CUMETAL_SOURCE="$CUMETAL_SOURCE" \
            .venv/bin/python .github/scripts/patch_cumetal_for_vibeqc.py
          CUMETAL_SOURCE="$CUMETAL_SOURCE" \
            .venv/bin/python .github/scripts/patch_cumetal_graph_for_vibeqc.py
          CUMETAL_SOURCE="$CUMETAL_SOURCE" \
            .venv/bin/python .github/scripts/patch_cumetal_cub_for_vibeqc.py
          CUMETAL_SOURCE="$CUMETAL_SOURCE" \
            .venv/bin/python .github/scripts/patch_cumetal_cublas_for_vibeqc.py
          cmake -S "$CUMETAL_SOURCE" -B "$CUMETAL_SOURCE/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$CUMETAL_PREFIX" \
            -DCUMETAL_BUILD_TESTS=OFF \
            -DCUMETAL_ENABLE_BINARY_SHIM=OFF \
            -DLLVM_DIR="$(brew --prefix llvm)/lib/cmake/llvm"
          cmake --build "$CUMETAL_SOURCE/build" --parallel 3
          cmake --install "$CUMETAL_SOURCE/build"

      - name: Verify CuMetal
        run: CUMETAL_ROOT="$CUMETAL_PREFIX" "$CUMETAL_PREFIX/bin/cumetal" doctor

      - name: Generate a CMake CUDA toolkit backed by CuMetal
        run: |
          FAKE_CUDA="$CUMETAL_SOURCE/build/cumetal-cuda-toolkit"
          if [[ ! -x "$FAKE_CUDA/bin/nvcc" ]]; then
            CUMETAL_BUILD_DIR="$CUMETAL_SOURCE/build" \
              bash "$CUMETAL_SOURCE/scripts/build_llama_cpp_cumetal.sh" --toolkit-only
          fi
          # VibeQC requires CUDA Toolkit >= 12.9. CuMetal's compatibility shim
          # reports 12.2 by default even though this lane is not using NVIDIA
          # toolkit implementation details; make the compatibility identity
          # satisfy VibeQC's configured minimum.
          for file in \
            "$FAKE_CUDA/version.json" \
            "$FAKE_CUDA/version.txt" \
            "$FAKE_CUDA/bin/nvcc" \
            "$FAKE_CUDA/lib/cmake/CUDAToolkit/CUDAToolkitConfig.cmake" \
            "$FAKE_CUDA/lib/cmake/CUDAToolkit/CUDAToolkitConfigVersion.cmake"; do
            if [[ -f "$file" ]]; then
              sed -i '' 's/12\.2/12.9/g' "$file"
            fi
          done
          # CuMetal implements these APIs in libcumetal.dylib. Ensure CMake's
          # FindCUDAToolkit can resolve the library names VibeQC links.
          for libdir in lib lib64; do
            mkdir -p "$FAKE_CUDA/$libdir"
            for lib in cudart cublas cublasLt cusolver; do
              ln -sf "$CUMETAL_SOURCE/build/libcumetal.dylib" \
                "$FAKE_CUDA/$libdir/lib${lib}.dylib"
            done
          done
          "$FAKE_CUDA/bin/nvcc" --version

      - name: Configure VibeQC with CUDA enabled
        run: |
          FAKE_CUDA="$CUMETAL_SOURCE/build/cumetal-cuda-toolkit"
          PATH="$FAKE_CUDA/bin:$PATH" cmake -S . -B "$VIBEQC_BUILD" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$(brew --prefix llvm)/bin/clang" \
            -DCMAKE_CXX_COMPILER="$(brew --prefix llvm)/bin/clang++" \
            -DCMAKE_CUDA_COMPILER="$FAKE_CUDA/bin/nvcc" \
            -DCMAKE_CUDA_COMPILER_LIBRARY_ROOT="$FAKE_CUDA" \
            -DCUDAToolkit_ROOT="$FAKE_CUDA" \
            -DCMAKE_CUDA_ARCHITECTURES=80 \
            -DPython3_EXECUTABLE="${GITHUB_WORKSPACE}/.venv/bin/python" \
            -DVIBEQC_CUDA_ARCHITECTURES=80 \
            -DVIBEQC_CUDA_COMPILE_ARCHITECTURES=80 \
            -DVIBEQC_BUILD_TESTS=OFF \
            -DVIBEQC_COMPILER_CACHE=off

      - name: Build the CUDA backend
        run: cmake --build "$VIBEQC_BUILD" --parallel 3

      - name: Install Python test dependencies
        run: uv pip install --python .venv/bin/python --editable '.[test]'

      - name: Run fast CUDA PR gate on the Apple GPU
        if: github.event_name == 'pull_request'
        timeout-minutes: 8
        env:
          CUMETAL_ROOT: /tmp/cumetal-install
          DYLD_LIBRARY_PATH: /tmp/cuda-metal/build
          VIBEQC_LIBRARY: ${{ github.workspace }}/build-cumetal/libvibeqc.dylib
          CUMETAL_TRACE_GPU: "1"
          CUMETAL_CUDA_TEST_MODE: gate
          CUMETAL_CUDA_TEST_TIMEOUT_SECONDS: "90"
        run: .venv/bin/python .github/scripts/run_cumetal_cuda_pytests.py

      - name: Run full CUDA suite on the Apple GPU
        if: github.event_name != 'pull_request'
        timeout-minutes: 50
        env:
          CUMETAL_ROOT: /tmp/cumetal-install
          DYLD_LIBRARY_PATH: /tmp/cuda-metal/build
          VIBEQC_LIBRARY: ${{ github.workspace }}/build-cumetal/libvibeqc.dylib
          CUMETAL_TRACE_GPU: "1"
          CUMETAL_CUDA_TEST_MODE: full
          CUMETAL_CUDA_TEST_TIMEOUT_SECONDS: "300"
        run: .venv/bin/python .github/scripts/run_cumetal_cuda_pytests.py
